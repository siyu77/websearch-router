name: Bug report
description: Report a problem with websearch-router
title: "bug: <short description>"
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting! Fill out as much as you can — it helps us reproduce and fix the issue.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened? What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: Steps to reproduce the behavior. Include the exact config / search provider setup if relevant.
      placeholder: |
        1. Start the server with ...
        2. Send request ...
        3. See error ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / errors
      description: Any console output, stack traces, or error messages.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version
      description: Which version are you using? (git rev / npm version / tag)
      placeholder: "v0.1.0"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: OS
      description: Which OS were you running on?
      options:
        - Windows
        - macOS
        - Linux
        - N/A (server/container)
    validations:
      required: true
  - type: input
    id: node
    attributes:
      label: Node.js version
      description: Output of `node --version`
      placeholder: "v22.5.0"
  - type: textarea
    id: environment
    attributes:
      label: Environment / deployment
      description: Anything notable about your setup (self-hosted path, package manager, proxy, etc.)