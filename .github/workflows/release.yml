name: Release

# Create a GitHub Release with auto-generated changelog whenever a version tag
# is pushed. npm publishing is handled separately by publish.yml.
#
# NOTE: publish.yml also listens on `v*` tags. This workflow only produces the
# GitHub Release (notes + tarball artifact); it does not publish to npm.
on:
  push:
    tags: ['v*']

permissions:
  contents: write # allow creating a Release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Build a publishable tarball and attach it to the Release.
      # pack.mjs likely emits websearch-router-<ver>.tgz (matches publish.yml).
      - run: npm run pack
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true # auto changelog from merged PRs / conventional commits
          files: |
            websearch-router-*.tgz
          draft: false
          prerelease: false